version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mtiso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mtiso}
      POSTGRES_USER: ${POSTGRES_USER:-mtiso_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtiso_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtiso_user} -d ${POSTGRES_DB:-mtiso}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MT103 to ISO 20022 Conversion Service
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtiso-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mtiso}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mtiso_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mtiso_pass}
      SPRING_FLYWAY_ENABLED: "true"
      SERVER_PORT: "8080"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres_data:

